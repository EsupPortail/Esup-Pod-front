name: Code Formatting

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  code-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          persist-credentials: false

      - name: set git config
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin https://x-access-token:${{ secrets.FORMAT_PUSH_TOKEN }}@github.com/${{ github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      # Prettify js+css code with prettier
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Running prettier
        run: |
          yarn prettier --write "src/**/*.{ts,tsx}"
          yarn prettier --write "src/**/*.css"

      - name: Check for modified files
        id: prettier-git-check
        run: echo modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi) >> $GITHUB_OUTPUT

      - name: Push prettify changes
        if: steps.prettier-git-check.outputs.modified == 'true'
        run: |
          git commit -am "Fixup. Format code with Prettier"
          git push

      # Lint/fix js code with ESLint (utilise eslint.config.mjs du repo, ESLint 9 flat config)
      - name: Running ESLint
        run: yarn eslint --fix "src/**/*.{ts,tsx}"
        continue-on-error: true

      - name: Check for modified files
        id: eslint-git-check
        run: echo modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi) >> $GITHUB_OUTPUT

      - name: Push eslint changes
        if: steps.eslint-git-check.outputs.modified == 'true'
        run: |
          git commit -am "Fixup. Format code with ESLint"
          git push