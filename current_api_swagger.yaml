  /api/videos/:
    get:
      operationId: videos_list
      description: 'Retrieve a list of videos. This endpoint supports advanced multi-value
        filtering. You can pass multiple values for the same parameter (e.g., `?tags__name=python&tags__name=django`
        or `?discipline=1&discipline=2`). Supported multi-value fields: `tags__name`,
        `tags__slug`, `type__slug`, `cursus__slug`, `discipline`, `status`, and `owner__username`.'
      summary: List videos
      parameters:
      - in: query
        name: channel
        schema:
          type: number
        description: Filter videos belonging to a specific channel by its database
          ID.
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
        description: Filter videos created on or after this ISO 8601 datetime, e.g.
          2026-06-18T10:00:00Z
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
        description: Filter videos created on or before this ISO 8601 datetime, e.g.
          2026-06-18T12:00:00Z
      - in: query
        name: cursus__slug
        schema:
          type: array
          items:
            type: string
        description: Filter videos by cursus slug(s). Multiple values are supported,
          e.g. ?cursus__slug=l1,l2
        explode: false
        style: form
      - in: query
        name: discipline
        schema:
          type: array
          items:
            type: integer
        description: Filter videos by discipline database ID(s). Multiple values are
          supported, e.g. ?discipline=1,2
        explode: true
        style: form
      - in: query
        name: is_auth_required
        schema:
          type: boolean
        description: Filter videos based on whether authentication is required to
          view them (true or false).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner__username
        schema:
          type: array
          items:
            type: string
        description: Filter videos by one or more owner usernames. Multiple values
          can be comma-separated or repeated, e.g. ?owner__username=user1,user2
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - DR
            - PU
            - RE
        description: |-
          Filter videos by publication status. Multiple statuses can be specified. Choices are: PU (Public), DR (Draft), RE (Restricted).

          * `DR` - Draft (Private)
          * `PU` - Published (Public)
          * `RE` - Restricted (Access Controlled)
        explode: true
        style: form
      - in: query
        name: tags__name
        schema:
          type: array
          items:
            type: string
        description: Filter videos by tag name(s). Multiple tag names are supported,
          e.g. ?tags__name=python,django
        explode: false
        style: form
      - in: query
        name: tags__slug
        schema:
          type: array
          items:
            type: string
        description: Filter videos by tag slug(s). Multiple tag slugs are supported,
          e.g. ?tags__slug=python,django
        explode: false
        style: form
      - in: query
        name: type__slug
        schema:
          type: array
          items:
            type: string
        description: Filter videos by type slug(s). Multiple values are supported,
          e.g. ?type__slug=course,conference
        explode: false
        style: form
      tags:
      - videos
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVideoList'
          description: ''
    post:
      operationId: videos_create
      description: API view set for the Video model.
      tags:
      - videos
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VideoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
          description: ''
