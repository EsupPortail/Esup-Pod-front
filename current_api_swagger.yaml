        Pass the comment_id of the parent comment in the URL path to add a reply.
        POST /comment/add/<video_slug>/
        POST /comment/add/<video_slug>/<comment_id>/
      summary: Add comment or reply
      parameters:
      - in: path
        name: video_slug
