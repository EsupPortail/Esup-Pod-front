  /api/videos/{slug}/stream/:
    get:
      operationId: videos_stream_retrieve
      description: |-
        Serves the video file as a progressive stream. Supports optional resolution filtering (e.g., 360p, 720p, 1080p).
        Falls back to the best available resolution if the requested one is not found.
      summary: Stream video file
      parameters:
      - in: query
        name: resolution
        schema:
          type: string
        description: Target resolution for streaming (e.g., '1080', '720p', '360').
          If specified without 'p', the backend automatically appends it.
      - in: path
        name: slug
        schema:
          type: string
          description: URL friendly identifier.
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: Ephemeral stream token obtained from /create-stream-token/.
        required: true
      tags:
      - videos
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Video stream served successfully (progressive MP4 stream).
        '404':
          description: Video file or specified resolution not found on disk.
        '403':
          description: Invalid or missing stream token.
