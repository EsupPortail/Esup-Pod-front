      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Plain text password to unlock the video.
                  example: securePassword123
                hash:
                  type: string
                  description: Legacy V4 SHA1 security hash to bypass the password
                    prompt.
                  example: 7c5a0c3b84138e1219b16828a2a7a409f584e03d
      security:
      - jwtAuth: []
      - {}
      responses:
