openapi: 3.0.3
info:
  title: Pod REST API
  version: 5.0.0-DEV
  description: Video management API (Local Authentication)
paths:
  /api/auth/access-groups/:
    get:
      operationId: auth_access_groups_list
      description: Retrieve a list of all LDAP or local access groups configured for
        the system. Restricted to superusers. Supports multi-value filtering (e.g.,
        `?code_name=A&code_name=B`).
      summary: List access groups
      parameters:
      - in: query
        name: code_name
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: display_name
        schema:
          type: string
        description: Display name contains
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessGroupList'
          description: ''
    post:
      operationId: auth_access_groups_create
      description: Create a new access group. Restricted to superusers.
      summary: Create an access group
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
  /api/auth/access-groups/{id}/:
    get:
      operationId: auth_access_groups_retrieve
      description: Retrieve detailed information about a specific access group. Restricted
        to superusers.
      summary: Retrieve access group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Access Group.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
    put:
      operationId: auth_access_groups_update
      description: Fully update an access group. Restricted to superusers.
      summary: Update an access group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Access Group.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessGroupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
    patch:
      operationId: auth_access_groups_partial_update
      description: Partially update an access group. Restricted to superusers.
      summary: Partially update an access group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Access Group.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccessGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccessGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccessGroupRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
    delete:
      operationId: auth_access_groups_destroy
      description: Delete an access group. Restricted to superusers.
      summary: Delete an access group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Access Group.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/access-groups/remove-users-by-name/:
    post:
      operationId: auth_access_groups_remove_users_by_name_create
      description: |-
        Removes a list of users (by their usernames) from an access group (by its code_name). Restricted to superusers.
        Equivalent of accessgroups_remove_users_by_name.
      summary: Remove users from an access group
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code_name:
                  type: string
                  description: The unique code name of the access group.
                users:
                  type: array
                  items:
                    type: string
                  description: Array of usernames to remove from the access group.
              required:
              - code_name
              - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
        '400':
          description: Missing code_name or users.
        '404':
          description: AccessGroup not found.
  /api/auth/access-groups/set-users-by-name/:
    post:
      operationId: auth_access_groups_set_users_by_name_create
      description: |-
        Replaces/assigns the list of users belonging to an access group by their usernames. Restricted to superusers.
        Equivalent of accessgroups_set_users_by_name.
      summary: Set users of an access group
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code_name:
                  type: string
                  description: The unique code name of the access group.
                users:
                  type: array
                  items:
                    type: string
                  description: Array of usernames to assign as sole members of this
                    access group.
              required:
              - code_name
              - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroup'
          description: ''
        '400':
          description: Missing code_name or users.
        '404':
          description: AccessGroup not found.
  /api/auth/groups/:
    get:
      operationId: auth_groups_list
      description: Retrieve a list of standard Django groups. Restricted to superusers.
      summary: List user permission groups
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupList'
          description: ''
    post:
      operationId: auth_groups_create
      description: Create a new Django group. Restricted to superusers.
      summary: Create a permission group
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/auth/groups/{id}/:
    get:
      operationId: auth_groups_retrieve
      description: Retrieve details of a specific group by ID. Restricted to superusers.
      summary: Retrieve permission group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    put:
      operationId: auth_groups_update
      description: Fully update a Django group. Restricted to superusers.
      summary: Update a permission group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    patch:
      operationId: auth_groups_partial_update
      description: Partially update a Django group. Restricted to superusers.
      summary: Partially update a permission group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroupRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    delete:
      operationId: auth_groups_destroy
      description: Delete a Django group. Restricted to superusers.
      summary: Delete a permission group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/logout-info/:
    get:
      operationId: auth_logout_info_retrieve
      description: Retrieves external logout URLs for OIDC, Shibboleth, and CAS.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutInfoResponse'
          description: ''
  /api/auth/owners/:
    get:
      operationId: auth_owners_list
      description: Retrieve a list of user profiles (Owner models) containing additional
        metadata such as affiliation, establishment, and profile picture. Restricted
        to superusers.
      summary: List user owner profiles
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwnerList'
          description: ''
    post:
      operationId: auth_owners_create
      description: Add a new Owner profile. Restricted to superusers.
      summary: Create an owner profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
  /api/auth/owners/{id}/:
    get:
      operationId: auth_owners_retrieve
      description: Retrieve details of a specific Owner profile. Restricted to superusers.
      summary: Retrieve owner profile details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
    put:
      operationId: auth_owners_update
      description: Fully update an existing Owner profile. Restricted to superusers.
      summary: Update an owner profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
    patch:
      operationId: auth_owners_partial_update
      description: Partially update an existing Owner profile. Restricted to superusers.
      summary: Partially update an owner profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOwnerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOwnerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOwnerRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
    delete:
      operationId: auth_owners_destroy
      description: Delete an Owner profile. Restricted to superusers.
      summary: Delete an owner profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/owners/{id}/picture/:
    post:
      operationId: auth_owners_picture_create
      description: Uploads and assigns an image as the user's profile picture, or
        deletes it if a DELETE request is made.
      summary: Update profile picture
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: string
                  format: binary
                  description: Image file to upload.
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile picture updated.
                  userpicture:
                    type: string
                    format: uri
          description: Profile picture updated successfully.
        '204':
          description: Profile picture deleted successfully.
        '400':
          description: No picture file provided.
        '403':
          description: Forbidden - cannot modify another user's picture.
    patch:
      operationId: auth_owners_picture_partial_update
      description: Uploads and assigns an image as the user's profile picture, or
        deletes it if a DELETE request is made.
      summary: Update profile picture
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: string
                  format: binary
                  description: Image file to upload.
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile picture updated.
                  userpicture:
                    type: string
                    format: uri
          description: Profile picture updated successfully.
        '204':
          description: Profile picture deleted successfully.
        '400':
          description: No picture file provided.
        '403':
          description: Forbidden - cannot modify another user's picture.
    delete:
      operationId: auth_owners_picture_destroy
      description: Uploads and assigns an image as the user's profile picture, or
        deletes it if a DELETE request is made.
      summary: Update profile picture
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Owner.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile picture updated.
                  userpicture:
                    type: string
                    format: uri
          description: Profile picture updated successfully.
        '204':
          description: Profile picture deleted successfully.
        '400':
          description: No picture file provided.
        '403':
          description: Forbidden - cannot modify another user's picture.
  /api/auth/owners/remove-user-accessgroup/:
    post:
      operationId: auth_owners_remove_user_accessgroup_create
      description: |-
        Removes access groups from a user based on their username. Restricted to superusers.
        Equivalent of accessgroups_remove_user_accessgroup.
      summary: Remove access groups from user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The unique username of the user.
                groups:
                  type: array
                  items:
                    type: string
                  description: List of access group code names to remove.
              required:
              - username
              - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWithGroups'
          description: ''
        '400':
          description: Missing username or groups.
        '404':
          description: User not found.
  /api/auth/owners/set-user-accessgroup/:
    post:
      operationId: auth_owners_set_user_accessgroup_create
      description: |-
        Assigns access groups to a user based on their username. Restricted to superusers.
        Equivalent of accessgroups_set_user_accessgroup.
      summary: Assign access groups to user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The unique username of the user.
                groups:
                  type: array
                  items:
                    type: string
                  description: List of access group code names to assign.
              required:
              - username
              - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWithGroups'
          description: ''
        '400':
          description: Missing username or groups.
        '404':
          description: User not found.
  /api/auth/sites/:
    get:
      operationId: auth_sites_list
      description: Retrieve a list of all sites/domains configured in this multi-tenant
        installation. Restricted to superusers.
      summary: List multi-site domains
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSiteList'
          description: ''
    post:
      operationId: auth_sites_create
      description: Add a new site/domain. Restricted to superusers.
      summary: Create a site domain
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
  /api/auth/sites/{id}/:
    get:
      operationId: auth_sites_retrieve
      description: Retrieve details of a specific site domain by ID. Restricted to
        superusers.
      summary: Retrieve site domain details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    put:
      operationId: auth_sites_update
      description: Fully update a site domain. Restricted to superusers.
      summary: Update a site domain
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    patch:
      operationId: auth_sites_partial_update
      description: Partially update a site domain. Restricted to superusers.
      summary: Partially update a site domain
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    delete:
      operationId: auth_sites_destroy
      description: Delete a site domain. Restricted to superusers.
      summary: Delete a site domain
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        **Authentication Endpoint**
        Accepts a username and password and returns a pair of JWT tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
