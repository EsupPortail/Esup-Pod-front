          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 45
                  author_name:
                    type: string
                    example: DOE Jane
                  author_picture:
                    type: string
                    format: uri
                    nullable: true
                    example: http://api.pod.univ.fr/media/users/avatar.jpg
                  content:
                    type: string
                    example: Interesting presentation, thank you!
                  added:
                    type: string
                    format: date-time
