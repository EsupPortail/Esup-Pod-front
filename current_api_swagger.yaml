    post:
      operationId: videos_unlock_create
      description: Unlocks a restricted/password-protected video using either a raw
        password in JSON body or a legacy V4 hash.
      summary: Unlock restricted video
      parameters:
      - in: query
        name: hash
        schema:
          type: string
        description: Optional legacy V4 SHA1 security hash passed via query parameters
          to unlock the stream.
      - in: path
        name: slug
        schema:
          type: string
          description: URL friendly identifier.
        required: true
      tags:
